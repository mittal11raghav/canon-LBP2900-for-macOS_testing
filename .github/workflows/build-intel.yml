
name: Build Canon LBP2900 Intel Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel

    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install autoconf automake

      - name: Compile Intel driver
        working-directory: captdriver
        run: |
          autoreconf -fi
          ./configure
          make CFLAGS="-D_DARWIN_C_SOURCE -std=gnu99 -O2"

      - name: Save compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: rastertocapt-intel
          path: captdriver/src/rastertocapt
          if-no-files-found: error
